<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NC COVID-19 Web GIS Dashboard (2020)</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <h1>North Carolina COVID-19 ZIP Dashboard</h1>
      <p>Daily ZIP-level cases and deaths from May 2 to Oct 2, 2020</p>
    </header>

    <main class="layout">
      <section class="panel controls" aria-label="Map controls">
        <div class="control-row">
          <label for="metricSelect">Metric</label>
          <select id="metricSelect">
            <option value="Cases">Cases</option>
            <option value="Deaths">Deaths</option>
          </select>
        </div>

        <div class="control-row">
          <label for="schemeSelect">Color scheme</label>
          <select id="schemeSelect">
            <option value="reds">Reds</option>
            <option value="blues">Blues</option>
            <option value="greens">Greens</option>
            <option value="oranges">Oranges</option>
          </select>
        </div>

        <div class="control-row slider-row">
          <label for="dateSlider">Date</label>
          <input id="dateSlider" type="range" min="0" max="0" step="1" value="0">
          <span id="dateLabel" class="value-label">-</span>
        </div>

        <div class="toggle-row">
          <label><input id="countiesToggle" type="checkbox"> Show county boundaries</label>
        </div>

        <div class="toggle-row">
          <label><input id="moranToggle" type="checkbox"> Show Local Moran's I (Oct 2, 2020)</label>
        </div>

        <div class="stats">
          <div>
            <strong>Total cases</strong>
            <span id="totalCases">-</span>
          </div>
          <div>
            <strong>Total deaths</strong>
            <span id="totalDeaths">-</span>
          </div>
        </div>
      </section>

      <section class="panel map-wrap" aria-label="Map panel">
        <div id="map"></div>
        <div id="legend" class="legend"></div>
      </section>

      <section class="panel side" aria-label="Chart and details">
        <h2>Daily Summary Time-Series</h2>
        <canvas id="summaryChart" width="360" height="220"></canvas>
        <div class="detail-card">
          <h3>ZIP Details</h3>
          <dl id="zipDetails">
            <div><dt>ZIP</dt><dd>-</dd></div>
            <div><dt>Place</dt><dd>-</dd></div>
            <div><dt>Cases</dt><dd>-</dd></div>
            <div><dt>Deaths</dt><dd>-</dd></div>
            <div><dt>Population</dt><dd>-</dd></div>
            <div><dt>Moran Cluster</dt><dd>-</dd></div>
          </dl>
        </div>
      </section>
    </main>

    <footer class="footer">
      Data source: <a href="https://github.com/mtdukes/nc-covid-by-zip">mtdukes/nc-covid-by-zip</a>
    </footer>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
  </html>
